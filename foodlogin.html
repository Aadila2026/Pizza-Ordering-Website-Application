<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Food Order</title>
    <link rel="Stylesheet" href="foodlogsign.css">
</head>
<body>
    <div class="cardlog">
        <h1>Enter Details For Log In</h1>
        <p>Login To Access Your Account</p><hr>
        <form>
        <div class="form-log">
        <label for="email">Email Id:</label>
        <input type="text" id="email" name="email" placeholder="Enter your Email Id"><br><br></div>
        <div class="form-log">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password"><br><br></div>
        <div class="area">
        <button type="button" class="button-submit" onclick="menu()">log In</button>
         </div>
        </form>
    </div>
    <script src="foodorder.js"></script>
</body>
</html>
