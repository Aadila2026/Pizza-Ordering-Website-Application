<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Food Order</title>
    <link rel="Stylesheet" href="foodlogsign.css">
</head>
<body>
    <div class="cardlog">
        <h1>Enter Details For Sign Up</h1>
        <p>SignUp for connecting with us</p><hr>
        <form>
        <div class="form-log">
        <label for="name">User Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your Name"><br><br></div>
        <div class="form-log">
        <label for="mobile number">Mob.no:</label>
        <input type="tel" id="name" name="mobile number" placeholder="Enter your Mobile Number"><br><br></div>
        <div class="form-log">
        <label for="email">Email Id:</label>
        <input type="text" id="email" name="email" placeholder="Enter your Email Id"><br><br></div>
        <div class="form-log">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password"><br><br>
        </div>
        <div class="area">
        <button type="button" class="button-submit" onclick="nextpage()">Sign Up</button>
        </div>
        </form>
    </div>
    <script src="foodorder.js"></script>
</body>
</html>
